<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>LIERO LAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&family=Rubik:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="boot">
    <div class="boot-card">
      <p class="eyebrow">LAN deathmatch</p>
      <h1>LIERO</h1>
      <p class="sub">Áss, lőj, zuhanj — egérrel célzol, mint a klasszikban. Több gép, egy Wi‑Fi.</p>
      <label>Név
        <input id="name" maxlength="16" placeholder="Féregnév" autocomplete="off" />
      </label>
      <button id="join" type="button">Csatlakozás</button>
      <p class="hint">A = bal · D = jobb · W / Space = ugrás · egér = célzás · katt = lövés · Q/E vagy görgő = fegyver</p>
    </div>
  </div>

  <div id="hud" hidden>
    <div class="hud-left">
      <div id="weapon">Pisztoly</div>
      <div id="hpwrap"><div id="hpbar"></div></div>
    </div>
    <div class="hud-right">
      <div id="score"></div>
      <div id="net"></div>
    </div>
  </div>

  <canvas id="game" width="1280" height="720"></canvas>
  <script src="/shared.js"></script>
  <script src="/client.js"></script>
</body>
</html>
